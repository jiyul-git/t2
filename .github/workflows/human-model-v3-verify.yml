name: Human Model V3 Verify

on:
  push:
    branches:
      - chatgpt/human-model-v3-20260929
    paths:
      - 'persona.py'
      - 'preflop.py'
      - 'plan.py'
      - 'reads.py'
      - 'tools/verify_human_model_v2.py'
      - 'tools/verify_human_model_v3.py'
      - 'tools/verify_human_model_v3_runtime.py'
      - 'tools/audit_calc_noise_v3.py'
      - 'tools/verify_calc_noise_v3.py'
      - 'tools/verify_read_recency_v3.py'
      - 'tools/verify_preflop_temper_direction_v3.py'
      - '.github/workflows/human-model-v3-verify.yml'
  workflow_dispatch:

concurrency:
  group: human-model-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Structural verifier
        run: python3 tools/verify_human_model_v3.py
      - name: Compile touched modules
        run: >-
          python3 -m py_compile persona.py preflop.py plan.py
          tools/verify_human_model_v3.py
          tools/verify_human_model_v3_runtime.py
          tools/audit_calc_noise_v3.py
          tools/verify_calc_noise_v3.py
          tools/verify_read_recency_v3.py
          tools/verify_preflop_temper_direction_v3.py
      - name: Temperament-direction V3 verifier
        run: python3 tools/verify_preflop_temper_direction_v3.py
      - name: Read-recency V3 verifier
        run: python3 tools/verify_read_recency_v3.py
      - name: Calc-noise V3 verifier
        run: python3 tools/verify_calc_noise_v3.py
      - name: Calc-noise directional audit
        env:
          T2_CALC_NOISE_V3: '0'
          T2_READ_RECENCY_V3: '0'
          T2_PREFLOP_TEMPER_DIRECTION_V3: '0'
        run: python3 tools/audit_calc_noise_v3.py > /tmp/calc_noise_v3.json
      - name: Upload calc-noise audit
        uses: actions/upload-artifact@v4
        with:
          name: calc-noise-v3-audit
          path: /tmp/calc_noise_v3.json

  paired-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Paired counterfactual, population, runtime attribution
        run: python3 tools/verify_human_model_v3_runtime.py

  baseline-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run v2 regression harness with all V3 flags OFF
        env:
          T2_PREFLOP_REASONING_V3: '0'
          T2_EXPLOIT_WEIGHT_V3: '0'
          T2_CALC_NOISE_V3: '0'
        run: python3 tools/verify_human_model_v2.py --out /tmp/human_v2.json
      - name: Verify V2 structural invariants; report historical core drift
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/human_v2.json'))
          required=('MATCH','B','D','E','F','G','A1')
          bad=[k for k in required if not bool((d.get(k) or {}).get('pass'))]
          # IDENT compares against the pre-core-upgrade historical action
          # fingerprints. P7 and multiway core changes intentionally move them;
          # keep that signal visible, but do not mistake it for a V3 regression.
          print(json.dumps({
            'historical_IDENT_diagnostic': d.get('IDENT'),
            'required': {k:(d.get(k) or {}).get('pass') for k in required},
            'pass': not bad,
          }, indent=2))
          if bad:
              raise SystemExit('V2 structural invariant failure: '+','.join(bad))
          PY
