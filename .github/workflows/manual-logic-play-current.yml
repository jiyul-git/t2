name: Manual Logic Play Current
on:
  push:
    branches: [chatgpt/human-model-v3-20260929]
    paths:
      - '.github/workflows/manual-logic-play-current.yml'
      - 'tools/manual_hand_actions.json'
      - 'tools/manual_more_hands.json'
      - 'tools/manual_hand4_actions.json'
      - 'tools/manual_following_hand_actions.json'
      - 'tools/manual_next_hand_actions.json'
      - 'plan.py'
      - 'ranges.py'
      - 'preflop.py'
      - 'reads.py'
      - 'session.py'
      - 'runner.py'
jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Play audited hero hand
        run: python3 tools/manual_one_hand.py
