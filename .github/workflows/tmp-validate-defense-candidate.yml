name: tmp validate production defense candidate
on:
  push:
    branches:
      - tmp/preflop-policy-shape-20260928
    paths:
      - preflop.py
      - .github/workflows/tmp-validate-defense-candidate.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/preflop-policy-shape-20260928
          fetch-depth: 0
      - name: Fetch public data
        run: |
          git fetch origin chatgpt/gto-reference-20260928:refs/remotes/origin/gto-reference
          git show origin/gto-reference:data/gto_public/8max_mtt_matthiola.jsonl > /tmp/8max_mtt_matthiola.jsonl
      - name: Syntax
        run: python3 -m py_compile preflop.py
      - name: Public policy-shape audit through production helper
        run: PYTHONPATH=. python3 tools/tmp_defend_policy_shape_audit.py
      - name: Gate isolation
        run: |
          PYTHONPATH=. python3 - <<'PY'
          import preflop
          P={'concepts':{'pf_defend':10.0},
             'temper':{'looseness':5.0,'aggression':5.0,'slowplay_taste':5.0},
             'type':'GTO_ISH'}
          def run(seats,ante,defp,opp,openbb):
              x=preflop.defend_action_likelihoods(
                  P,defp,opp,['A'+'s','T'+'h'],100,openbb,0,
                  raise_level=1,stack_bb=100,seats=seats,ante=ante,
                  opener_allin=False,can_raise=True)
              assert abs(x['attack']+x['call']+x['fold']-1.0)<1e-9
              return x.get('policy_shape')
          intended=run(8,True,'BB','BTN',2.5)
          noante=run(8,False,'BB','BTN',2.5)
          nine=run(9,True,'BB','BTN',2.5)
          unsupported=run(8,True,'HJ','UTG',2.5)
          wrongsize=run(8,True,'BB','BTN',4.0)
          assert intended=='mtt8_compact_semantic_v1', intended
          assert noante is None, noante
          assert nine is None, nine
          assert unsupported is None, unsupported
          assert wrongsize is None, wrongsize
          print('GATE_ISOLATION PASS', intended, noante, nine, unsupported, wrongsize)
          PY
      - name: Preflop closure
        run: PYTHONPATH=. python3 tools/verify_preflop_closure.py
      - name: 9max regression isolation
        run: PYTHONPATH=. python3 tools/regress.py check --baseline current
      - name: Commit refreshed candidate audit
        if: success()
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/gto_public/defend_policy_shape_audit_20260928.json data/gto_public/defend_policy_shape_audit_20260928.md
          git diff --cached --quiet || git commit -m "analysis: verify compact defense candidate through production path"
          git push origin HEAD:tmp/preflop-policy-shape-20260928
