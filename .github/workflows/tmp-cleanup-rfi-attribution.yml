name: tmp cleanup RFI attribution branch
on:
  push:
    branches:
      - chatgpt/gto-reference-20260928
    paths:
      - '.github/workflows/tmp-cleanup-rfi-attribution.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete completed RFI attribution branch
        run: gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/tmp/rfi-attribution-20260928"
