name: HAND130 range posterior audit

on:
  push:
    branches:
      - chatgpt/hand130-range-posterior-audit-20261010
  workflow_dispatch:

jobs:
  range_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile static range audit
        run: python3 -m py_compile tools/verify_hand130_range_posterior.py
      - name: Verify first-in vs 3bet shove and shared producer wiring
        run: python3 tools/verify_hand130_range_posterior.py
      - name: Archived B37 decision replay (does not reconstruct equity)
        run: python3 tools/verify_hand130_b37_replay.py
      - name: Exact terminal prize ICM
        run: python3 tools/verify_hand130_exact_icm.py
      - name: Existing preflop role verification
        run: python3 tools/verify_pf_threebet_split.py
