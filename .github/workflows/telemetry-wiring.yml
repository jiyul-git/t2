name: telemetry-wiring

on:
  push:
    branches:
      - chatgpt/logic-tuning-20260927
    paths:
      - 'telemetry_sync.py'
      - 'fieldsim.py'
      - 'live2.py'
      - 'ui/server/ui_server.py'
      - 'ui/tools/setup_run_dir.sh'
      - 'tools/verify_telemetry_wiring.py'
      - '.github/workflows/telemetry-wiring.yml'
  workflow_dispatch:

concurrency:
  group: telemetry-wiring-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax
        run: |
          python3 -m py_compile telemetry_sync.py fieldsim.py live2.py ui/server/ui_server.py tools/verify_telemetry_wiring.py

      - name: Telemetry setup opt-in
        run: |
          rm -rf /tmp/t2_tm_play
          T2_TELEMETRY=1 sh ui/tools/setup_run_dir.sh /tmp/t2_tm_play
          test -f /tmp/t2_tm_play/telemetry_sync.py
          test -f /tmp/t2_tm_play/telemetry_config.json
          grep -q '"branch": "telemetry/live"' /tmp/t2_tm_play/telemetry_config.json

      - name: Real-engine telemetry schema
        run: python3 tools/verify_telemetry_wiring.py

      - name: Strategy regression unchanged
        run: python3 tools/regress.py check --baseline current
