name: telemetry-wiring

on:
  push:
    branches:
      - chatgpt/logic-tuning-20260927
  workflow_dispatch:

concurrency:
  group: telemetry-wiring-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax
        run: |
          python3 -m py_compile telemetry_sync.py
          python3 -m py_compile tools/verify_tournament_telemetry.py

      - name: Whole-tournament telemetry
        run: python3 tools/verify_tournament_telemetry.py

      - name: Strategy regression
        run: python3 tools/regress.py check --baseline current

      - name: Telemetry setup-run-dir wiring
        run: |
          T2_TELEMETRY=1 sh ui/tools/setup_run_dir.sh /tmp/t2_telemetry_run
          test -f /tmp/t2_telemetry_run/telemetry_sync.py
          test -f /tmp/t2_telemetry_run/telemetry_config.json
          python3 - <<'PY'
          import json
          p='/tmp/t2_telemetry_run/telemetry_config.json'
          d=json.load(open(p))
          assert d['enabled'] is True
          assert d['branch'] == 'telemetry/live'
          print('setup telemetry config: OK')
          PY
