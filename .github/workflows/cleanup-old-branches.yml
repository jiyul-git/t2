name: one-shot branch cleanup
on:
  push:
    paths:
      - '.github/workflows/cleanup-old-branches.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete verified obsolete branch refs
        shell: bash
        run: |
          set -u
          failed=0
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            echo "delete: $branch"
            if ! gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null; then
              echo "::error::failed to delete $branch"
              failed=1
            fi
          done <<'BRANCHES'
chatgpt/a5-block-context-4a-20260925
chatgpt/a5-reachability-20260922
chatgpt/a6-replan-provenance-20260922
chatgpt/blockbet-donk-audit-20260926
chatgpt/concept-prior-audit-20260926
chatgpt/concept-prior-sensitivity-20260926
chatgpt/concept-wiring-audit-20260926
chatgpt/decision-architecture-audit-20260926
chatgpt/docs-consolidation-20260928
chatgpt/effective-allin-v1-20260925
