name: One-shot delete stale ccr branch 2026-10-01

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/delete-stale-ccr-20261001.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[delete-stale-ccr-20261001]')
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale CCR ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/ccr-9a10123b-0lyye0"
