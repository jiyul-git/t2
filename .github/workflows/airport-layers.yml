name: Build airport illustrated layers
on:
  push:
    branches:
      - chatgpt/airport-lobby-day-night-20261016
    paths:
      - ui/tools/build_airport_layers.py
      - .github/workflows/airport-layers.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/airport-lobby-day-night-20261016
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline processing dependencies
        run: pip install pillow numpy opencv-python-headless
      - name: Rebuild pixel-accurate layer assets and verify composite
        run: python ui/tools/build_airport_layers.py
      - name: Push ONLY generated airport art to isolated UI branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/web/assets/t2-airport/layers
          if git diff --cached --quiet; then
            echo "Assets already match."
          else
            git commit -m "assets: rebuild approved-airport separate sprite layers"
            git push origin HEAD:chatgpt/airport-lobby-day-night-20261016
          fi
