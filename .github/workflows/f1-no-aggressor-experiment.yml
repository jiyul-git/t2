name: f1-no-aggressor-experiment

on:
  push:
    branches:
      - chatgpt/f1-no-aggressor-semantics
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        seed: [3000,3001,3002,3003,3004,3005,3010,3011,3012,3013,4242,5150,7301,9001]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile probe
        run: python3 -m py_compile tools/f1_no_aggressor.py
      - name: Run fixed-seed fixture
        run: |
          python3 tools/f1_no_aggressor.py --seeds ${{ matrix.seed }} --hands 20 --json | tee f1_result_${{ matrix.seed }}.json
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-result-${{ matrix.seed }}
          path: f1_result_${{ matrix.seed }}.json
