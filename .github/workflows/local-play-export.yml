name: Local-play source export
on:
  push:
    branches: [chatgpt/test3-local-browser-play-20261009]
    paths:
      - '.github/workflows/local-play-export.yml'
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: t3-test3-local-source
          path: |
            *.py
            *.json
            ui/server/
            ui/web/
            ui/tools/
            coarse_params/
          retention-days: 1
