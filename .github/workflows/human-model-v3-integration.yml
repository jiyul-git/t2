name: Human Model V3 Integration

on:
  push:
    branches:
      - chatgpt/human-model-v3-20260929
    paths:
      - 'tools/verify_human_model_v3_integration.py'
      - '.github/workflows/human-model-v3-integration.yml'
  workflow_dispatch:

concurrency:
  group: human-model-v3-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Combined all-on 9-max integration
        run: python3 tools/verify_human_model_v3_integration.py | tee /tmp/hm3_integration.json
      - uses: actions/upload-artifact@v4
        with:
          name: human-model-v3-integration
          path: /tmp/hm3_integration.json
