name: Concept Learning Verify

on:
  push:
    branches: [test]
    paths:
      - 'persona.py'
      - 'tools/verify_concept_prerequisites.py'
      - 'docs/semantic_audit/CONCEPT_PREREQUISITE_DESIGN.md'
      - '.github/workflows/concept-learning-verify.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python3 -m py_compile persona.py tools/verify_concept_prerequisites.py
      - name: Verify learning structure
        run: python3 tools/verify_concept_prerequisites.py
