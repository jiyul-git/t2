name: f1-validation

on:
  push:
    branches:
      - chatgpt/f1-no-aggressor-semantics
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python3 -m compileall -q .
      - name: F-1 strict semantics
        run: python3 tools/f1_no_aggressor.py --seeds 3000,4242,9001 --hands 20 --verify
      - name: OOP semantics
        run: python3 tools/verify_oop_semantics.py
      - name: Blockbet selftest
        run: python3 tools/selftest_blockbet.py
      - name: Reachability
        run: python3 tools/reachability.py --check
      - name: Current regression
        run: python3 tools/regress.py check --baseline current
