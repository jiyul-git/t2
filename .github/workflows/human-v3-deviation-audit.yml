name: Human V3 Deviation Audit

on:
  push:
    branches:
      - chatgpt/human-model-v3-20260929
    paths:
      - 'tools/audit_preflop_deviation_shape_v3.py'
      - '.github/workflows/human-v3-deviation-audit.yml'
  workflow_dispatch:

concurrency:
  group: human-v3-deviation-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run preflop deviation saturation audit
        env:
          T2_PREFLOP_REASONING_V3: '1'
        run: python3 tools/audit_preflop_deviation_shape_v3.py > /tmp/deviation_audit.json
      - name: Summarize clamp rates
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/deviation_audit.json'))
          for q,v in d['population'].items():
              a=v['current_span4']; b=v['natural_span5']
              print('q',q,
                    'span4 open/def',a['open']['clamp_rate'],a['defend']['clamp_rate'],
                    'span5 open/def',b['open']['clamp_rate'],b['defend']['clamp_rate'],
                    'delta95',v['abs_width_delta']['open']['p95'],
                    v['abs_width_delta']['defend']['p95'])
              for label,z in [('span4',a),('span5',b)]:
                  for s,x in z['defend']['by_spot'].items():
                      if x['clamp_rate'] >= .02:
                          print(' ',label,'defend',s,x['clamp_rate'])
          print('collision_probe')
          for label,rows in d['collision_probe'].items():
              print(label)
              for row in rows:
                  print(' skill',row['skill'],
                        {p:x['adjacent_ties'] for p,x in row['positions'].items()})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: human-v3-deviation-audit
          path: /tmp/deviation_audit.json
