name: tmp cleanup POST_RANGE branches
on:
  push:
    branches:
      - chatgpt/gto-reference-20260928
    paths:
      - '.github/workflows/tmp-cleanup-post-range-branches.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete completed ChatGPT POST_RANGE branches
        run: |
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/tmp/post-range-soft-shadow-20260928" || true
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/tmp/post-range-soft-pareto-20260928" || true
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/tmp/post-range-soft-pareto-fast-20260928" || true
