name: a5-blockbet-verify

on:
  push:
    branches:
      - claude/a5-blockbet-fix

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: python3 -m py_compile plan.py tools/block_trace.py tools/replan_provenance.py tools/verify_replan_contract.py
      - name: Replan contract unchanged
        run: python3 tools/verify_replan_contract.py
      - name: Block plan reachability
        run: python3 tools/block_trace.py --seeds 5000-5007 --jobs 4
      - name: Current regression
        run: python3 tools/regress.py check --baseline current
      - name: A6 full fixture after A5
        run: python3 tools/replan_provenance.py
