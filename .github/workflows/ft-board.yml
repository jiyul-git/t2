# 전체 트리 보드 계산을 GitHub Actions 에서 돌린다(공개 저장소: 실행 시간 무료·무제한, 4코어, 작업당 최대 6시간, 동시 20개).
# 사용: 브랜치 claude/gha_ft_<이름> 에 파일 gha_jobs.txt 를 두고 푸시한다. 줄마다 "<STACK> <BASE브랜치> <보드번호> <묶음> [<묶음>...]".
#   이 워크플로 파일도 그 브랜치에 있어야 한다(푸시 트리거는 푸시된 커밋의 워크플로를 쓴다).
# 작업마다 ft_worker.sh 를 최대 330분 돌린다. 못 끝난 작업은 실패로 끝나므로 "Re-run failed jobs" 한 번이면 이어서 한다(올라간 보드는 건너뜀).
# 시험: gha_test_boards 파일에 N 을 쓰면 앞 N 보드만 풀고 결과는 올리지 않는다(빌드·실행·푸시 권한 확인용).
# 결과는 각 보드 브랜치 claude/ft<STACK>_board_<n> 로 푸시된다(ft_status.sh 가 그대로 센다).
name: ft-board
on:
  push:
    branches: ['claude/gha_ft_*']
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          rows=[l.split() for l in open('gha_jobs.txt') if l.strip() and not l.startswith('#')]
          print('matrix='+json.dumps({'include':[{'stack':r[0],'base':r[1],'board':r[2],'bundles':' '.join(r[3:])} for r in rows]}))
          PY
  board:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: b${{ matrix.board }} ${{ matrix.bundles }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: dirs
        run: |
          sudo mkdir -p /home/user && sudo chown "$USER" /home/user
          git config --global user.name "t2-gha"; git config --global user.email "t2-gha@users.noreply.github.com"
      - name: worker
        env:
          FT_STACK: ${{ matrix.stack }}
          FT_BASE: ${{ matrix.base }}
          FT_WORKER_MIN: '330'
          FT_SESSION: gha-${{ github.run_id }}
        run: |
          git fetch -q origin "$FT_BASE"
          git show FETCH_HEAD:tools/gto_fulltree/ft_worker.sh > /tmp/ftw.sh
          export SPOT_PANEL_WORKERS=$(nproc)
          # 시험 모드: 트리거 브랜치에 gha_test_boards 파일(숫자)이 있으면 앞 N 보드만, 결과는 푸시하지 않고 푸시 권한만 확인
          if [ -f gha_test_boards ]; then export FT_TEST_BOARDS=$(cat gha_test_boards) FT_NO_PUSH=1; git push -q origin HEAD:refs/heads/claude/gha_pushtest_${{ github.run_id }}_${{ matrix.board }} && echo PUSH_OK; fi
          bash /tmp/ftw.sh ${{ matrix.board }} ${{ matrix.bundles }} | tee /tmp/ftw.out
          tail -1 /tmp/ftw.out | grep -q WORKER_ALL_DONE
