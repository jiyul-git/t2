name: tmp cleanup GTO branches
on:
  push:
    branches:
      - chatgpt/gto-reference-20260928
    paths:
      - '.github/workflows/tmp-cleanup-gto-branches.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete completed temporary branches
        run: |
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/tmp/gto-public-data-import-20260928"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/tmp/gto-t4-hj-ato-20260928"
