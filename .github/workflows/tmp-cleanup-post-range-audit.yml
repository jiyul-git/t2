name: tmp cleanup POST_RANGE audit branch
on:
  push:
    branches:
      - chatgpt/gto-reference-20260928
    paths:
      - '.github/workflows/tmp-cleanup-post-range-audit.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete completed POST_RANGE audit branch
        run: gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/tmp/post-range-audit-20260928"
