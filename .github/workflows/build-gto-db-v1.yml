name: build GTO DB v1
on:
  push:
    branches:
      - chatgpt/gto-reference-20260928
    paths:
      - tools/build_gto_db_v1.py
      - .github/workflows/build-gto-db-v1.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/gto-reference-20260928
      - name: Build canonical DB
        run: python3 tools/build_gto_db_v1.py
      - name: Validate DB
        run: |
          python3 - <<'PY'
          import json, pathlib, math
          p=pathlib.Path("data/gto_db/preflop_spots_v1.jsonl")
          rows=[json.loads(x) for x in p.read_text().splitlines() if x.strip()]
          assert len(rows)==202, len(rows)
          assert sum(r["strategy"]["hand_class_count"] for r in rows)==34138
          bad=[]
          for r in rows:
              for h,a in r["strategy"]["hands"].items():
                  s=sum(float(a.get(k,0)) for k in ("fold","call","raise","allin"))
                  if abs(s-1.0)>0.011:
                      bad.append((r["spot_id"],h,s))
          print("spots",len(rows),"bad_action_sums",len(bad))
          assert not bad[:1], bad[:5]
          idx=json.load(open("data/gto_db/index_v1.json"))
          assert idx["spot_count"]==202
          assert idx["hand_frequency_rows"]==34138
          PY
      - name: Commit generated DB
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/gto_db
          git commit -m "gto-db: build canonical 202-spot preflop reference"
          git push origin HEAD:chatgpt/gto-reference-20260928
