name: integration-regression
on:
  push:
    branches:
      - integration/ui-v49-money-jump-20260920

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: UI predeploy regression
        run: sh ui/tools/predeploy_check.sh
      - name: Money-jump regressions
        run: |
          python3 tools/verify_money_jump_context.py
          python3 tools/verify_money_jump_observation.py
          python3 tools/verify_money_pressure_signals.py
          python3 -m py_compile money_pressure.py preflop.py tools/money_form_check.py
