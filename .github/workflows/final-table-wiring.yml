name: final-table-wiring

on:
  push:
    branches:
      - integration/latest-20260927
  workflow_dispatch:

jobs:
  wiring:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax and UI predeploy
        run: sh ui/tools/predeploy_check.sh

      - name: Final-table ICM fast path
        run: python3 tools/verify_icm_fast.py

      - name: Build isolated play directory
        run: sh ui/tools/setup_run_dir.sh /tmp/t2_playtest

      - name: Play 100-entry final table through real UI API
        run: python3 tools/playtest_final_table_ui.py /tmp/t2_playtest
