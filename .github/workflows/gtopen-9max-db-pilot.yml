name: gtopen 9max 30bb exact-uniform pilot

on:
  push:
    branches:
      - chatgpt/gto-30bb-uniform-pilot-20261003
    paths:
      - tools/run_gtopen_9max_db_pilot.py
      - vendor/gtopen/crates/solver/src/preflop/**
      - vendor/gtopen/crates/server/src/main.rs
      - .github/workflows/gtopen-9max-db-pilot.yml

concurrency:
  group: gtopen-9max-30bb-uniform
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        seed: [101, 202, 303, 404]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/gto-30bb-uniform-pilot-20261003

      - name: Build current GTOpen server
        working-directory: vendor/gtopen
        run: cargo build --release -p server

      - name: Start seeded server
        working-directory: vendor/gtopen
        env:
          PREFLOP_EQ_SAMPLES: "1200"
          PREFLOP_EQ_SEED: "${{ matrix.seed }}"
          PREFLOP_MULTIWAY_SEED: "${{ matrix.seed }}"
          SOLVER_THREADS: "4"
        run: |
          ./target/release/gto-server >/tmp/gtopen9.log 2>&1 &
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:3737/api/preflop/capabilities >/dev/null && exit 0
            sleep 1
          done
          tail -100 /tmp/gtopen9.log
          exit 1

      - name: Solve exact-uniform 30bb pilot
        env:
          GT9_STACK: "30"
          GT9_ITERS: "60"
          GT9_TARGET: "0.15"
          GT9_MAX_RAISES: "2"
          GT9_REALIZATION: "static"
          GT9_SEED: "${{ matrix.seed }}"
          PREFLOP_EQ_SEED: "${{ matrix.seed }}"
          PREFLOP_MULTIWAY_SEED: "${{ matrix.seed }}"
        run: python3 tools/run_gtopen_9max_db_pilot.py

      - name: Assert exact T2 mechanics
        env:
          SEED: "${{ matrix.seed }}"
        run: |
          python3 - <<'PY'
          import json, math, os
          p=f"data/gto_9max_solver_pilot_30bb_uniform_static_seed{os.environ['SEED']}.json"
          d=json.load(open(p))
          assert d["table_players"] == 9
          assert d["hand_start_players"] == 9
          assert abs(d["hand_start_stack_bb"] - 30.0) < 1e-12
          assert abs(d["solver_stack_after_ante_bb"] - (30.0-1.0/9.0)) < 1e-12
          a=d["solver_ante_model"]
          assert a["kind"] == "uniform_total"
          assert a["exact_t2_ante"] is True
          assert abs(a["per_player_bb"] - 1.0/9.0) < 1e-12
          assert abs(a["total_bb"] - 1.0) < 1e-12
          assert a["folds_resplit"] is False
          cfg=d["config"]
          assert abs(cfg["ante"] - 1.0/9.0) < 1e-12
          assert abs(cfg["dead_money"]) < 1e-12
          print("mechanics exact", p)
          PY

      - name: Upload seeded result
        uses: actions/upload-artifact@v4
        with:
          name: uniform-static-${{ matrix.seed }}
          path: data/gto_9max_solver_pilot_30bb_uniform_static_seed${{ matrix.seed }}.json
          if-no-files-found: error

      - name: Server log
        if: always()
        run: tail -100 /tmp/gtopen9.log || true

  aggregate:
    if: ${{ always() }}
    needs: solve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/gto-30bb-uniform-pilot-20261003

      - name: Download seeded results
        uses: actions/download-artifact@v4
        with:
          pattern: uniform-static-*
          path: data/ensemble
          merge-multiple: true

      - name: Aggregate without auto-promotion
        run: |
          python3 - <<'PY'
          import glob, json, statistics

          refs={"UTG":.165,"UTG+1":.186,"UTG+2":.217,"LJ":.257,
                "HJ":.299,"CO":.375,"BTN":.487}
          files=sorted(glob.glob("data/ensemble/gto_9max_solver_pilot_30bb_uniform_static_seed*.json"))
          runs=[]
          for p in files:
              d=json.load(open(p))
              st=d["solver"]["status"]
              gap=st.get("gap_total")
              q=gap is not None and float(gap) <= float(d["solver"]["target_gap"])
              mae=statistics.fmean(abs(d["rfi_combo_weighted"][pos]-refs[pos]) for pos in refs)
              runs.append({
                  "seed":d["run_seed"],
                  "gap_total":gap,
                  "iteration":st.get("iteration"),
                  "convergence_qualified":q,
                  "rfi_mae_vs_external_check":mae,
                  "rfi":d["rfi_combo_weighted"],
                  "spot_count":len(d["spots"]),
              })

          def stat(vals):
              vals=[float(x) for x in vals]
              return {
                  "n":len(vals),
                  "mean":statistics.fmean(vals) if vals else None,
                  "sd":statistics.stdev(vals) if len(vals)>1 else 0.0 if vals else None,
              }

          complete=len(runs)==4
          convergence_ready=complete and all(x["convergence_qualified"] for x in runs)
          out={
              "schema_version":"gto_9max_30bb_uniform_pilot_v2",
              "hand_start_players":9,
              "hand_start_stack_bb":30.0,
              "ante_model":{
                  "kind":"uniform_total",
                  "per_player_bb":1.0/9.0,
                  "total_bb":1.0,
                  "folds_resplit":False,
                  "exact_t2_ante":True,
              },
              "tree_scope":"restricted open+3bet validation tree (max_raises=2); not a full-tree solution",
              "seeds":[101,202,303,404],
              "received_runs":len(runs),
              "complete":complete,
              "convergence_ready":convergence_ready,
              "canonical_promotion_ready":False,
              "promotion_blocker":"pilot/restricted tree and preflop continuation model require validation before canonical DB admission",
              "runs":runs,
              "aggregate":{
                  "gap_total":stat([x["gap_total"] for x in runs if x["gap_total"] is not None]),
                  "rfi_mae_vs_external_check":stat([x["rfi_mae_vs_external_check"] for x in runs]),
                  "rfi":{pos:stat([x["rfi"][pos] for x in runs]) for pos in refs},
              },
              "external_rfi_check":refs,
          }
          with open("data/gto_9max_solver_pilot_30bb_uniform_ensemble.json","w") as f:
              json.dump(out,f,indent=2,sort_keys=True)

          print(json.dumps({
              "received":len(runs),
              "complete":complete,
              "convergence_ready":convergence_ready,
              "canonical_promotion_ready":False,
              "mean_rfi_mae":out["aggregate"]["rfi_mae_vs_external_check"]["mean"],
          },sort_keys=True))
          PY

      - name: Commit diagnostic ensemble
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/gto_9max_solver_pilot_30bb_uniform_ensemble.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "gto: record exact-uniform 30bb pilot ensemble"
          git push origin HEAD:chatgpt/gto-30bb-uniform-pilot-20261003
