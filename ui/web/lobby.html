<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1514">
<title>T2 Poker Lobby</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="lobby.css?v=3">
</head>
<body>
<div id="lobby">
  <header class="top">
    <div>
      <div class="brand">T2 <span>POKER</span></div>
      <div class="strap">INTERNATIONAL TERMINAL</div>
    </div>
  </header>

  <main>
    <section id="current" class="current" hidden></section>

    <section class="hero">
      <div class="eyebrow">PLAY YOUR TOURNAMENT</div>
      <h1>오늘은 어떤 판을<br>고를까요?</h1>
      <p>구조·필드·상금 방식이 다른 토너먼트를 고르고 바로 테이블에 입장합니다.</p>
    </section>

    <section class="modes" aria-label="게임 모드">
      <button class="mode active" type="button">
        <span class="modeIcon">♠</span><b>토너먼트</b><small>현재 이용 가능</small>
      </button>
      <button class="mode" type="button" disabled>
        <span class="modeIcon">●</span><b>캐시게임</b><small>확장 예정</small>
      </button>
      <button class="mode" type="button" disabled>
        <span class="modeIcon">⚡</span><b>Sit & Go</b><small>확장 예정</small>
      </button>
    </section>

    <section class="section">
      <div class="sectionHead">
        <div>
          <h2>토너먼트</h2>
          <p>엔진의 실제 포맷을 그대로 불러옵니다.</p>
        </div>
        <div class="tabs" id="tabs">
          <button class="active" data-filter="all" type="button">전체</button>
          <button data-filter="speed" type="button">스피드</button>
          <button data-filter="field" type="button">필드</button>
          <button data-filter="special" type="button">스페셜</button>
        </div>
      </div>
      <div id="tournaments" class="tournaments"></div>
    </section>
  </main>

  <div id="joinSheet" class="sheetWrap" hidden>
    <div class="sheet">
      <button id="sheetClose" class="close" type="button" aria-label="닫기">×</button>
      <div id="joinTitle" class="joinTitle"></div>
      <div id="joinFacts" class="joinFacts"></div>
      <label class="inputLabel">참가 인원
        <input id="entries" type="number" inputmode="numeric" min="2" max="400" value="100">
      </label>
      <div class="quick" id="quickEntries">
        <button type="button" data-n="45">45</button>
        <button type="button" data-n="100" class="active">100</button>
        <button type="button" data-n="180">180</button>
        <button type="button" data-n="300">300</button>
      </div>
      <label class="inputLabel">시드 <span>선택 사항</span>
        <input id="seed" type="number" inputmode="numeric" placeholder="자동 생성">
      </label>
      <button id="join" class="join" type="button">이 토너먼트 참가</button>
      <div id="joinHint" class="joinHint"></div>
    </div>
  </div>

  <div id="profileSheet" class="sheetWrap" hidden>
    <div class="sheet profileSheet">
      <div class="sheetHeader">
        <div>
          <div class="kicker">PROFILE</div>
          <h2>내 프로필</h2>
        </div>
        <button id="profileClose" class="close" type="button" aria-label="닫기">×</button>
      </div>

      <div class="profileIdentity">
        <div id="profilePreview" class="profilePreview" aria-hidden="true"></div>
        <label class="nicknameField">
          <span>닉네임</span>
          <input id="nickname" type="text" maxlength="16" placeholder="플레이어">
        </label>
      </div>

      <div class="settingList">
        <button id="pickAvatar" class="settingRow" type="button">
          <span class="settingText"><b>내 캐릭터</b><small>테이블에 표시되는 캐릭터</small></span>
          <span class="settingValue"><span id="avatarMini" class="avatarMini"></span><span id="avatarValue">캐릭터 1</span><i>›</i></span>
        </button>

        <button id="pickTheme" class="settingRow" type="button">
          <span class="settingText"><b>공항 테마</b><small>로비의 시간대</small></span>
          <span class="settingValue"><span id="themeValue">밤</span><i>›</i></span>
        </button>

        <button id="pickDeck" class="settingRow" type="button">
          <span class="settingText"><b>카드 뒷면</b><small>테이블 카드덱 디자인</small></span>
          <span class="settingValue"><span id="deckMini" class="deckMini"></span><span id="deckValue">비취</span><i>›</i></span>
        </button>

        <button id="pickSpeed" class="settingRow" type="button">
          <span class="settingText"><b>게임 진행 속도</b><small>봇 액션과 딜링 간격</small></span>
          <span class="settingValue"><span id="speedValue">보통 · 1.5초</span><i>›</i></span>
        </button>

        <label class="settingRow toggleSetting">
          <span class="settingText"><b>결과 자동진행</b><small>정산 뒤 다음 핸드로 자동 이동</small></span>
          <span class="switch"><input id="profileAuto" type="checkbox"><i></i></span>
        </label>

        <button id="profileHistory" class="settingRow" type="button">
          <span class="settingText"><b>핸드 기록</b><small>완료된 핸드 다시 보기</small></span>
          <span class="settingValue"><i>›</i></span>
        </button>
      </div>

      <button id="profileSave" class="primaryAction" type="button">저장</button>
    </div>
  </div>

  <div id="pickerSheet" class="sheetWrap pickerWrap" hidden>
    <div class="sheet pickerSheet">
      <div class="sheetHeader pickerHeader">
        <button id="pickerBack" class="backButton" type="button" aria-label="뒤로">‹</button>
        <div><div class="kicker">SELECT</div><h2 id="pickerTitle">선택</h2></div>
        <button id="pickerClose" class="close" type="button" aria-label="닫기">×</button>
      </div>
      <div id="pickerBody" class="pickerBody"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <nav class="bottom">
    <button class="active" type="button"><span>♠</span>로비</button>
    <button id="continueNav" type="button"><span>▶</span>테이블</button>
    <button id="profileNav" type="button"><span>●</span>프로필</button>
  </nav>
</div>
<script src="visuals.js?v=1"></script>
<script src="lobby.js?v=3"></script>
</body>
</html>
