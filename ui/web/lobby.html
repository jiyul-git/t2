<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1514">
<title>t2 포커 · 토너먼트 로비</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="lobby.css?v=25">
</head>
<body>
<div id="lobby">
  <header class="top">
    <div>
      <div class="brand"><span aria-hidden="true">♠</span> T2</div>
      <div class="strap">토너먼트 라운지</div>
    </div>
    <button id="walletNav" class="walletBadge" type="button" aria-label="보유 칩 내역">♠ <b id="walletBalance">—</b></button>
    <button id="headerProfileNav" class="header-profile" type="button" aria-label="프로필 및 설정">⚙</button>
  </header>

  <main>
    <section class="airport-scene" id="lounge" aria-label="공항 라운지 일러스트">
      <div class="lounge-fallback" aria-hidden="true"></div>
      <canvas class="lounge-canvas" aria-hidden="true"></canvas>
    </section>
    <div class="airport-scene-copy">
      <h1>오늘 열리는 토너먼트</h1>
      <p>지금 참가할 수 있는 대회와 곧 시작할 대회를 확인하세요.</p>
    </div>

    <section id="featured" class="featured" hidden aria-label="추천 대회">
      <div class="featured-top">
        <span>◷ 곧 시작하는 대회</span>
        <span id="featuredLead" class="featured-meta"></span>
      </div>
      <div class="featured-detail">
        <img class="featured-thumb" src="assets/t2-airport/card_featured.webp" alt="" aria-hidden="true">
        <div class="featured-main">
          <div class="featured-head">
            <div class="featured-title"><h2 id="featuredName"></h2><p id="featuredWhen"></p></div>
            <span id="featuredStatus" class="featured-status"></span>
          </div>
          <div class="featured-metrics">
            <div class="featured-stat"><span>바이인</span><strong id="featuredBuyin"></strong></div>
            <div class="featured-stat"><span>참가</span><strong id="featuredCount"></strong></div>
            <button type="button" id="featuredJoin" class="featured-button">대회 정보 ›</button>
          </div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="sectionHead">
        <div>
          <h2>예정된 대회</h2>
          <p>원하는 방식의 대회를 찾아보세요.</p>
        </div>
        <div class="tabs" id="tabs">
          <button class="active" data-filter="all" type="button">전체</button>
          <button data-filter="standard" type="button">표준</button>
          <button data-filter="turbo" type="button">터보</button>
          <button data-filter="deepstack" type="button">딥스택</button>
        </div>
      </div>
      <div id="tournaments" class="tournaments"></div>
    </section>

    <section id="current" class="current" hidden aria-label="참가 중인 대회"></section>
  </main>

  <div id="joinSheet" class="sheetWrap" hidden>
    <div class="sheet">
      <button id="sheetClose" class="close" type="button" aria-label="닫기">×</button>
      <div id="joinTitle" class="joinTitle"></div>
      <div id="joinFacts" class="joinFacts"></div>
      <p id="joinCost" class="cost"></p>
      <p class="rulesNote">등록이 열려 있는 동안 참가할 수 있습니다. 자리를 비우면 자동으로 체크하거나 폴드하며 블라인드는 계속 차감됩니다.</p>
      <button id="join" class="join" type="button">이 토너먼트 참가</button>
      <button id="cancelRegistration" class="secondaryAction" type="button" hidden>예약 취소 · 칩 환불</button>
      <div id="joinHint" class="joinHint"></div>
    </div>
  </div>

  <div id="walletSheet" class="sheetWrap" hidden>
    <div class="sheet">
      <button id="walletClose" class="close" type="button" aria-label="닫기">×</button>
      <h2>내 칩</h2><div id="walletDetail"></div>
    </div>
  </div>

  <div id="profileSheet" class="sheetWrap" hidden>
    <div class="sheet profileSheet">
      <div class="sheetHeader">
        <div>
          <div class="kicker">PROFILE</div>
          <h2>내 프로필</h2>
        </div>
        <button id="profileClose" class="close" type="button" aria-label="닫기">×</button>
      </div>

      <label class="inputLabel">닉네임
        <input id="nickname" type="text" maxlength="16" placeholder="플레이어">
      </label>

      <div class="profileLabel">내 캐릭터</div>
      <div id="avatarPreview" class="avatarPreview"></div>
      <div id="avatarChoices" class="avatarChoices"></div>

      <div class="profileLabel">카드 뒷면</div>
      <div id="deckChoices" class="deckChoices">
        <button type="button" data-deck="jade"><span class="deckSample jade"></span><b>비취</b></button>
        <button type="button" data-deck="navy"><span class="deckSample navy"></span><b>남청</b></button>
        <button type="button" data-deck="burgundy"><span class="deckSample burgundy"></span><b>자주</b></button>
        <button type="button" data-deck="ivory"><span class="deckSample ivory"></span><b>백자</b></button>
      </div>

      <button id="profileSave" class="join" type="button">저장</button>

      <div id="accountBlock" class="accountBlock" hidden>
        <div class="profileLabel">내 계정</div>
        <div id="accountEmail" class="accountEmail"></div>
        <button id="logoutBtn" class="secondaryAction" type="button">로그아웃</button>
        <button id="deleteAccountBtn" class="dangerAction" type="button">계정 삭제</button>
      </div>
    </div>
  </div>

  <div id="deleteSheet" class="sheetWrap" hidden>
    <div class="sheet">
      <div class="sheetHeader">
        <div>
          <div class="kicker">ACCOUNT</div>
          <h2>계정 삭제</h2>
        </div>
        <button id="deleteClose" class="close" type="button" aria-label="닫기">×</button>
      </div>
      <p class="deleteWarn">닉네임·캐릭터, 칩과 대회 기록이 모두 지워지고 되돌릴 수 없습니다. 계속하려면 아래에 <b>삭제</b>를 입력하세요.</p>
      <label class="inputLabel">확인 입력
        <input id="deleteConfirm" type="text" autocomplete="off" placeholder="삭제">
      </label>
      <button id="deleteGo" class="join dangerJoin" type="button" disabled>계정 삭제</button>
      <div id="deleteErr" class="joinHint"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <nav class="bottom" aria-label="로비 메뉴">
    <button id="lobbyNav" class="active" type="button"><span aria-hidden="true">⌂</span>로비</button>
    <button id="eventsNav" type="button"><span aria-hidden="true">♜</span>대회</button>
    <button id="myEventsNav" type="button"><span aria-hidden="true">▥</span>내 기록</button>
    <button id="profileNav" type="button"><span aria-hidden="true">⚙</span>설정</button>
  </nav>
</div>
<script src="lounge/sun.js?v=2"></script>
<script src="lounge/location.js?v=2"></script>
<script src="lounge/lighting.js?v=2"></script>
<script src="lounge/board.js?v=2"></script>
<script src="lounge/behavior.js?v=7"></script>
<script src="lounge/assets.js?v=2"></script>
<script src="lounge/renderer.js?v=14"></script>
<script src="lounge/lounge.js?v=9"></script>
<script src="lobby.js?v=20"></script>
</body>
</html>
