<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1514">
<title>T2 Poker Lobby</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="lobby.css?v=2">
</head>
<body>
<div id="lobby">
  <header class="top">
    <div>
      <div class="brand">T2 <span>POKER</span></div>
      <div class="strap">TOURNAMENT LOBBY</div>
    </div>
  </header>

  <main>
    <section id="current" class="current" hidden></section>

    <section class="hero">
      <div class="eyebrow">PLAY YOUR TOURNAMENT</div>
      <h1>오늘은 어떤 판을<br>고를까요?</h1>
      <p>구조·필드·상금 방식이 다른 토너먼트를 고르고 바로 테이블에 입장합니다.</p>
    </section>

    <section class="section">
      <div class="sectionHead">
        <div>
          <h2>토너먼트</h2>
          <p>엔진의 실제 포맷을 그대로 불러옵니다.</p>
        </div>
        <div class="tabs" id="tabs">
          <button class="active" data-filter="all" type="button">전체</button>
          <button data-filter="speed" type="button">스피드</button>
          <button data-filter="field" type="button">필드</button>
          <button data-filter="special" type="button">스페셜</button>
        </div>
      </div>
      <div id="tournaments" class="tournaments"></div>
    </section>
  </main>

  <div id="joinSheet" class="sheetWrap" hidden>
    <div class="sheet">
      <button id="sheetClose" class="close" type="button" aria-label="닫기">×</button>
      <div id="joinTitle" class="joinTitle"></div>
      <div id="joinFacts" class="joinFacts"></div>
      <label class="inputLabel">참가 인원
        <input id="entries" type="number" inputmode="numeric" min="2" max="400" value="100">
      </label>
      <div class="quick" id="quickEntries">
        <button type="button" data-n="45">45</button>
        <button type="button" data-n="100" class="active">100</button>
        <button type="button" data-n="180">180</button>
        <button type="button" data-n="300">300</button>
      </div>
      <label class="inputLabel">시드 <span>선택 사항</span>
        <input id="seed" type="number" inputmode="numeric" placeholder="자동 생성">
      </label>
      <button id="join" class="join" type="button">이 토너먼트 참가</button>
      <div id="joinHint" class="joinHint"></div>
    </div>
  </div>

  <div id="profileSheet" class="sheetWrap" hidden>
    <div class="sheet profileSheet">
      <div class="sheetHeader">
        <div>
          <div class="kicker">PROFILE</div>
          <h2>내 프로필</h2>
        </div>
        <button id="profileClose" class="close" type="button" aria-label="닫기">×</button>
      </div>

      <label class="inputLabel">닉네임
        <input id="nickname" type="text" maxlength="16" placeholder="플레이어">
      </label>

      <div class="profileLabel">카드 뒷면</div>
      <div id="deckChoices" class="deckChoices">
        <button type="button" data-deck="jade"><span class="deckSample jade"></span><b>비취</b></button>
        <button type="button" data-deck="navy"><span class="deckSample navy"></span><b>남청</b></button>
        <button type="button" data-deck="burgundy"><span class="deckSample burgundy"></span><b>자주</b></button>
        <button type="button" data-deck="ivory"><span class="deckSample ivory"></span><b>백자</b></button>
      </div>

      <div class="settingsGrid">
        <label>게임 진행 속도
          <select id="profileSpeed">
            <option value="1000">빠르게 · 1.0초</option>
            <option value="1500">보통 · 1.5초</option>
            <option value="2000">천천히 · 2.0초</option>
            <option value="2600">매우 천천히 · 2.6초</option>
          </select>
        </label>
        <label class="toggleRow">결과 자동진행
          <input id="profileAuto" type="checkbox">
        </label>
      </div>

      <button id="profileHistory" class="secondaryAction" type="button">핸드 기록 보기</button>
      <button id="profileSave" class="join" type="button">저장</button>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <nav class="bottom">
    <button class="active" type="button"><span>♠</span>로비</button>
    <button id="continueNav" type="button"><span>▶</span>테이블</button>
    <button id="profileNav" type="button"><span>●</span>프로필</button>
  </nav>
</div>
<script src="lobby.js?v=2"></script>
</body>
</html>
