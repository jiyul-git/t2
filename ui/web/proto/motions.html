<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>T2 손 동작 시제품</title>
<style>
  :root{--ink:#3a2414;--paper:#fbf1dc;--navy:#2b3150;--amber:#f2b84b}
  html,body{margin:0;height:100%;background:#1d2238;overflow:hidden;font-family:"Jua","Gowun Dodum",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
  .bar{position:fixed;left:8px;top:8px;right:150px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
  .grp{display:flex;gap:5px;padding:5px;border-radius:14px;background:rgba(20,22,38,.55);border:2px solid rgba(18,15,28,.6);pointer-events:auto}
  button{font:inherit;font-size:13px;height:30px;padding:0 9px;border-radius:11px;border:2.5px solid var(--ink);background:var(--paper);color:var(--ink);
    box-shadow:0 3px 0 var(--ink);cursor:pointer}
  button:active,button.pressed{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
  button.hot{background:linear-gradient(180deg,#ffd77e,#f2b84b)}
  button.on{background:#474d72;color:#fbefd6}
  .top{position:fixed;right:8px;top:8px;display:flex;gap:5px}
  .note{position:fixed;right:12px;bottom:8px;color:#fbefd6;font-size:12px;text-shadow:0 1px 2px #000;opacity:.8}
  .shot .bar,.shot .top,.shot .note{display:none}
  .rot{display:none;position:fixed;inset:0;place-items:center;color:#fbefd6;background:#1d2238;font-size:18px;text-align:center}
  @media (orientation:portrait){.rot{display:grid}}
</style>
</head>
<body>
<script>if(new URLSearchParams(location.search).get("shot"))document.documentElement.classList.add("shot")</script>
<canvas id="c"></canvas>
<div class="note">손 동작 시제품 · 손은 임시 상자</div>
<div class="top grp">
  <button data-view="fp" class="on">1인칭</button>
  <button data-view="close">가까이</button>
</div>
<div class="bar">
  <div class="grp">
    <button data-act="deal">새 카드</button>
    <button data-act="tidy">카드 정리</button>
    <button data-act="peek">들춰보기</button>
    <button data-act="flip">앞/뒤</button>
    <button data-act="protector" class="hot">프로텍터</button>
    <button data-act="fold">폴드</button>
  </div>
  <div class="grp">
    <button data-act="shuffle" class="hot">칩 셔플</button>
    <button data-act="idle">대기 셔플</button>
    <button data-act="bet">칩 내밀기</button>
    <button data-act="allin">올인</button>
    <button data-act="chipreset">칩 되돌리기</button>
  </div>
</div>
<div class="rot">가로로 돌려 주세요</div>
<script type="module" src="motions.js"></script>
</body>
</html>
