name: verify-postflop-events
on:
  push:
    branches:
      - chatgpt/logic-tuning-20260927
    paths:
      - action_events.py
      - runner.py
      - session.py
      - ranges.py
      - plan.py
      - tools/verify_postflop_events.py
      - tools/verify_f5_backaction.py
      - .github/workflows/verify-postflop-events.yml
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m py_compile action_events.py runner.py session.py ranges.py plan.py
      - run: python3 tools/verify_postflop_events.py
      - run: python3 tools/verify_f5_backaction.py
