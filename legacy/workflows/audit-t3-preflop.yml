name: audit-t3-preflop
on:
  push:
    branches:
      - chatgpt/logic-tuning-20260927
    paths:
      - tools/audit_t3_preflop.py
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/audit_t3_preflop.py
