name: Core Multiway Reads
on:
  push:
    branches: [chatgpt/human-model-v3-20260929]
    paths:
      - 'plan.py'
      - 'ranges.py'
      - 'session.py'
      - 'runner.py'
      - 'tools/verify_core_multiway_reads.py'
      - 'tools/verify_core_joint_nut.py'
      - '.github/workflows/core-multiway-reads.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile core
        run: python3 -m py_compile plan.py session.py runner.py ranges.py
      - name: Verify multiway read/stack selection
        run: python3 tools/verify_core_multiway_reads.py
      - name: Verify joint nut semantics
        run: python3 tools/verify_core_joint_nut.py
      - name: 9-max integration regression
        run: python3 tools/verify_human_model_v3_integration.py
