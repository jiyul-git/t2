name: read-range-semantics

on:
  push:
    branches:
      - chatgpt/logic-tuning-20260927
  workflow_dispatch:

concurrency:
  group: read-range-semantics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: |
          python3 -m py_compile persona.py ranges.py plan.py session.py
          python3 -m py_compile tools/verify_read_range_semantics.py
      - name: Read/range semantic regression
        run: python3 tools/verify_read_range_semantics.py
      - name: Legacy strategy fingerprint (informational)
        continue-on-error: true
        run: python3 tools/regress.py check --baseline current
