<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071e22">
<title>T2</title>
<style>
 :root{--bg:#071e22;--gold:#f4d38e;--gold2:#e0b161;--text:#fff3d8;--muted:#c5d6d0;--line:#4b6e71;--danger:#ffab98}
 *{box-sizing:border-box}
 html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;
  -webkit-tap-highlight-color:transparent;overflow:hidden}
 .bg{position:fixed;inset:0;background:url(/pub/lobby_hero_night.webp) center top/cover no-repeat;filter:blur(2px) brightness(.55);transform:scale(1.04)}
 .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#071e2266,#071e22 72%)}
 .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 22px calc(28px + env(safe-area-inset-bottom));
  opacity:0;pointer-events:none;transform:translateY(12px);transition:opacity .45s ease,transform .45s cubic-bezier(.2,.8,.2,1)}
 .screen.on{opacity:1;pointer-events:auto;transform:none}
 .brand{font-size:64px;font-weight:900;font-style:italic;letter-spacing:-.06em;color:#ffe1a4;text-shadow:0 4px 18px #000a;line-height:1}
 .brand span{display:inline-block}
 .tag{margin-top:10px;font-size:13px;letter-spacing:.32em;color:var(--muted)}
 /* splash */
 #splash .brand span{animation:t2-deal 1.1s cubic-bezier(.2,.8,.2,1) both}
 #splash .brand span:nth-child(2){animation-delay:.12s}
 @keyframes t2-deal{from{opacity:0;transform:translateY(-30px) rotate(-14deg)}to{opacity:1;transform:none}}
 .bar{margin-top:42px;width:160px;height:4px;border-radius:4px;background:#ffffff1f;overflow:hidden}
 .bar i{display:block;height:100%;width:40%;border-radius:4px;background:linear-gradient(90deg,var(--gold2),var(--gold));animation:t2-load 1.2s ease-in-out infinite}
 @keyframes t2-load{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
 .status{margin-top:14px;font-size:12px;color:var(--muted);min-height:16px}
 /* cards */
 .card{width:100%;max-width:380px;margin-top:34px;background:#0b2a2fd9;border:1px solid #d0aa6955;border-radius:20px;padding:26px 20px;
  box-shadow:0 14px 40px #000a;backdrop-filter:blur(8px)}
 .card h2{margin:0 0 6px;font-size:20px;letter-spacing:-.04em}
 .card p{margin:0 0 20px;font-size:13px;line-height:1.5;color:var(--muted)}
 .gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:50px;border:0;border-radius:26px;background:#fff;color:#1f1f1f;
  font-size:15px;font-weight:700;cursor:pointer;transition:transform .15s}
 .gbtn:active{transform:scale(.97)}
 .gbtn svg{width:20px;height:20px}
 #gsi{display:flex;justify-content:center;min-height:44px}
 #gsi .note{margin:0;text-align:center;color:rgba(255,255,255,.55);font-size:13px;line-height:1.6}
 .err{color:var(--danger);font-size:13px;min-height:18px;margin-top:12px;text-align:center}
 .fine{font-size:11px;color:#9fb2aa;margin-top:16px;text-align:center;line-height:1.5}
 label{display:block;font-size:12px;color:var(--muted);margin:16px 0 6px}
 input[type=text],input[type=email]{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#071a1d;color:#fff;font-size:15px;outline:none}
 input:focus{border-color:var(--gold)}
 .avatars{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
 .avatars button{aspect-ratio:1;border:2px solid transparent;border-radius:12px;background:#0d1917;padding:2px;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;cursor:pointer;transition:transform .15s,border-color .15s}
 .avatars button img{width:100%;height:100%;object-fit:cover}
 .avatars button.on{border-color:var(--gold);transform:scale(1.06)}
 .agree{display:flex;gap:9px;align-items:flex-start;font-size:12px;color:var(--muted);margin-top:16px;line-height:1.45}
 .agree input{margin-top:2px;width:18px;height:18px;accent-color:var(--gold)}
 .primary{width:100%;margin-top:20px;min-height:50px;border:0;border-radius:14px;background:linear-gradient(90deg,#cda95f,#e1c786);color:#17201b;font-size:16px;font-weight:900;cursor:pointer}
 .primary:disabled{opacity:.45}
 .who{font-size:12px;color:var(--muted);text-align:center;margin-top:14px}
 .who a{color:var(--gold)}
 .dev{display:none;gap:8px;margin-top:18px}
 .dev input{flex:1}
 .dev button{padding:0 14px;border:0;border-radius:12px;background:#244;color:var(--gold);font-weight:800}
 @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg"></div>

<section class="screen on" id="splash">
  <div class="brand"><span>♠</span> <span>T2</span></div>
  <div class="tag">POKER LOUNGE</div>
  <div class="bar"><i></i></div>
  <div class="status" id="splashStatus">라운지 여는 중…</div>
</section>

<section class="screen" id="login">
  <div class="brand"><span>♠</span> T2</div>
  <div class="card">
    <h2>로그인</h2>
    <p>초대받은 구글 계정으로 들어오세요.<br>처음이면 바로 회원가입으로 이어집니다.</p>
    <div id="gsi"></div>
    <div class="err" id="loginErr"></div>
    <form class="dev" id="dev"><input id="devEmail" type="email" placeholder="개발용 이메일"><button>입장</button></form>
    <div class="fine">칩, 설정, 대회 기록은 계정에 저장되어<br>어느 기기에서든 이어집니다.</div>
  </div>
</section>

<section class="screen" id="signup">
  <div class="card" style="margin-top:0">
    <h2>회원가입</h2>
    <p>라운지에서 쓸 이름과 캐릭터를 정해 주세요.</p>
    <label for="nick">닉네임</label>
    <input id="nick" type="text" maxlength="16" autocomplete="nickname" placeholder="1~16자">
    <label>캐릭터</label>
    <div class="avatars" id="avatars"></div>
    <label class="agree"><input type="checkbox" id="agree"><span>T2는 지인끼리 즐기는 게임용 칩만 씁니다. 칩은 현금으로 바꿀 수 없고, 계정은 초대한 사람이 관리합니다.</span></label>
    <button class="primary" id="signupBtn" disabled>시작하기</button>
    <div class="err" id="signupErr"></div>
    <div class="who" id="signupWho"></div>
  </div>
</section>

<script>
const CLIENT_ID = __CLIENT_ID__, DEV = __DEV_LOGIN__;
const $ = id => document.getElementById(id);
const IN_APP = !!(window.T2App && window.T2App.signIn);
const GOOGLE_G = '<svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.8-6.8C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.6 13.3l7.9 6.1C12.4 13.7 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.3 5.7c4.3-4 7-9.9 7-17.1z"/><path fill="#FBBC05" d="M10.5 28.6A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.6l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.3-5.7c-2 1.4-4.7 2.3-8.6 2.3-6.3 0-11.6-4.2-13.5-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>';

function show(id){ document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }
async function api(path, body){
  const r = await fetch(path, body === undefined ? {cache:'no-store'} :
    {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const d = await r.json().catch(() => ({}));
  return {ok:r.ok, status:r.status, d};
}

// ---- splash: decide where to go
async function boot(){
  const t0 = Date.now();
  let me;
  try { me = await api('/auth/me'); } catch(e) { me = null; }
  await new Promise(r => setTimeout(r, Math.max(0, 900 - (Date.now() - t0))));   // let the logo land
  if (!me) { $('splashStatus').textContent = '서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.'; setTimeout(boot, 4000); return; }
  if (me.ok && me.d.registered) return enterLobby();
  if (me.ok) return openSignup(me.d);
  openLogin();
}
function enterLobby(){
  $('splashStatus').textContent = '라운지로 들어가는 중…';
  show('splash');
  location.replace('/');
}

// ---- login
let gsiReady = false;
function openLogin(){
  show('login');
  if (IN_APP) {
    $('gsi').innerHTML = '<button class="gbtn" id="appbtn">' + GOOGLE_G + '구글 계정으로 계속하기</button>';
    $('appbtn').onclick = () => { $('loginErr').textContent = ''; window.T2App.signIn(); };
  } else if (CLIENT_ID && !gsiReady) {
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = () => {
      gsiReady = true;
      google.accounts.id.initialize({client_id: CLIENT_ID, callback: r => window.t2SignIn(r.credential)});
      google.accounts.id.renderButton($('gsi'), {theme:'filled_black', size:'large', shape:'pill', text:'continue_with', locale:'ko', width:300});
    };
    s.onerror = () => { $('loginErr').textContent = '구글 로그인을 불러오지 못했습니다'; };
    document.head.appendChild(s);
  } else if (!CLIENT_ID) {
    $('gsi').innerHTML = '<p class="note">구글 로그인이 아직 설정되지 않았습니다' + (DEV ? '<br>아래 개발용 입장을 쓰세요' : '') + '</p>';
  }
  if (DEV) $('dev').style.display = 'flex';
}
async function signedIn(res){
  if (!res.ok) { $('loginErr').textContent = res.d.error || '로그인 실패 (' + res.status + ')'; return; }
  if (res.d.registered) return enterLobby();
  openSignup(res.d);
}
// The Android app signs in with Google natively and hands the ID token here.
window.t2SignIn = async token => signedIn(await api('/auth/google', {id_token: token}));
window.t2SignInError = msg => { $('loginErr').textContent = msg || '로그인을 취소했습니다'; };
$('dev').onsubmit = async e => { e.preventDefault(); signedIn(await api('/auth/dev', {email: $('devEmail').value})); };

// ---- sign-up
let avatar = -1;
function openSignup(me){
  show('signup');
  $('signupWho').innerHTML = (me.email || '') + ' · <a href="#" id="other">다른 계정</a>';
  $('other').onclick = async e => { e.preventDefault(); await api('/auth/logout', {}); openLogin(); };
  if (!$('nick').value && me.name) $('nick').value = me.name.slice(0, 16);
  $('avatars').innerHTML = Array.from({length: 9}, (_, i) =>
    '<button type="button" data-i="' + i + '"><img alt="" src="/pub/portraits/' + String(i + 1).padStart(2, '0') + '.png"></button>').join('');
  $('avatars').querySelectorAll('button').forEach(b => b.onclick = () => {
    avatar = Number(b.dataset.i);
    $('avatars').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    check();
  });
  check();
}
function check(){ $('signupBtn').disabled = !($('nick').value.trim() && avatar >= 0 && $('agree').checked); }
$('nick').oninput = check; $('agree').onchange = check;
$('signupBtn').onclick = async () => {
  $('signupBtn').disabled = true; $('signupErr').textContent = '';
  $('signupBtn').textContent = '내 지갑 만드는 중…';
  const r = await api('/auth/register', {nickname: $('nick').value.trim(), avatar, agree: $('agree').checked});
  $('signupBtn').textContent = '시작하기';
  if (!r.ok) { $('signupErr').textContent = r.d.error || '가입 실패'; check(); return; }
  try { localStorage.setItem('t2profile_nickname', $('nick').value.trim()); localStorage.setItem('t2profile_avatar', String(avatar)); } catch(e) {}
  enterLobby();
};

boot();
</script>
</body>
</html>
