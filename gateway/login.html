<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1514">
<title>T2 로그인</title>
<style>
 :root{--bg:#071e22;--gold:#f4d38e;--text:#fff3d8;--muted:#c5d6d0;--paper:#fbf0db;--ink:#1b3338;--danger:#ff9d8a}
 html,body{margin:0;min-height:100%;background:radial-gradient(120% 80% at 20% 0%,#1d4a49,var(--bg) 60%);color:var(--text);
  font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
 main{max-width:380px;margin:0 auto;padding:18vh 22px 40px;text-align:center}
 .brand{font-size:44px;font-weight:900;font-style:italic;letter-spacing:-.06em;color:#ffe1a4;text-shadow:0 3px 10px #0008}
 .brand span{color:#ffde9e}
 p{color:var(--muted);font-size:14px;line-height:1.5;margin:10px 0 34px}
 .card{background:#0b2a2fcc;border:1px solid #d0aa6966;border-radius:18px;padding:26px 20px;box-shadow:0 10px 30px #0007}
 #gbtn{display:flex;justify-content:center;min-height:44px}
 .hint{font-size:12px;color:var(--muted);margin-top:16px}
 .err{color:var(--danger);font-size:13px;min-height:18px;margin-top:14px}
 .dev{margin-top:22px;display:none;gap:8px}
 .dev input{flex:1;padding:11px;border-radius:10px;border:1px solid #355149;background:#091411;color:#fff}
 .dev button{padding:11px 14px;border:0;border-radius:10px;background:var(--gold);color:#17201b;font-weight:800}
</style>
</head>
<body>
<main>
  <div class="brand"><span>♠</span> T2</div>
  <p>초대받은 구글 계정으로 로그인하세요.<br>처음 로그인하면 내 지갑이 만들어집니다.</p>
  <div class="card">
    <div id="gbtn"></div>
    <div class="err" id="err"></div>
    <div class="hint">칩, 설정, 대회 기록은 계정에 저장되어 어느 기기에서든 이어집니다.</div>
    <form class="dev" id="dev"><input id="devEmail" type="email" placeholder="개발용 이메일"><button>입장</button></form>
  </div>
</main>
<script>
const CLIENT_ID = __CLIENT_ID__, DEV = __DEV_LOGIN__;
const err = m => { document.getElementById('err').textContent = m || ''; };
async function signIn(path, body) {
  err('');
  try {
    const r = await fetch(path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
    const d = await r.json().catch(() => ({}));
    if (!r.ok) return err(d.error || '로그인 실패 (' + r.status + ')');
    location.replace('/');
  } catch (e) { err('서버에 연결할 수 없습니다'); }
}
// The Android app signs in natively and calls this with the Google ID token.
window.t2SignIn = token => signIn('/auth/google', {id_token: token});
if (window.T2App && T2App.signIn) {
  document.getElementById('gbtn').innerHTML = '<button id="appbtn" style="padding:12px 18px;border:0;border-radius:22px;background:#fff;color:#222;font-weight:700">구글 계정으로 로그인</button>';
  document.getElementById('appbtn').onclick = () => T2App.signIn();
} else if (CLIENT_ID) {
  const s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
  s.onload = () => {
    google.accounts.id.initialize({client_id: CLIENT_ID, callback: r => window.t2SignIn(r.credential)});
    google.accounts.id.renderButton(document.getElementById('gbtn'), {theme: 'filled_black', size: 'large', shape: 'pill', text: 'signin_with', locale: 'ko'});
  };
  document.head.appendChild(s);
} else if (!DEV) {
  err('구글 로그인이 아직 설정되지 않았습니다');
}
if (DEV) {
  const f = document.getElementById('dev'); f.style.display = 'flex';
  f.onsubmit = e => { e.preventDefault(); signIn('/auth/dev', {email: document.getElementById('devEmail').value}); };
}
</script>
</body>
</html>
